
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLink</title>
  <style>
    body {
      background: #f2efff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    h1 { color: #333; }
    p { color: #666; }
    a {
      display: block;
      background: white;
      padding: 18px;
      margin: 15px auto;
      max-width: 350px;
      border-radius: 15px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    a:hover { background: #ddd6ff; }
  </style>
</head>
<body>
  <h1>MY LINK</h1>
  <p>안녕하세요! 저의 마이링크 페이지입니다.</p>
  <a href="https://www.instagram.com">Instagram</a>
  <a href="https://www.youtube.com">YouTube</a>
  <a href="https://github.com">GitHub</a>
</body>
</html>
